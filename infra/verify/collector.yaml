receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 1s
exporters:
  otlphttp/lgtm:
    endpoint: http://lgtm:4318
  file/traces:
    path: /evidence/traces.jsonl
  file/metrics:
    path: /evidence/metrics.jsonl
  file/logs:
    path: /evidence/logs.jsonl
service:
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, otlphttp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics, otlphttp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs, otlphttp/lgtm]
