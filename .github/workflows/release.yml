name: Release images

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize releases so concurrent runs cannot race while updating latest.
concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ocms
            description: '二次元コンテンツの整理・探索に重点を置いたコンテンツマネージャー。タグ・キャラクター推定、関連コンテンツ表示、柔軟な重複管理、サーバーサイド暗号化が特徴です。認証はOIDCのみに対応します。'
            suffix: ''
            tag_suffix: ''
            compat_alias: false
            build_args: ''
            dockerfile: Dockerfile
          - image: ocms-runtime-cpu
            description: 'OCMSのタグ・キャラクター推定、意味検索、文字起こしと、お気に入りに基づく推薦に使う推論Runtime。CPU版とCUDAライブラリ同梱版を提供します。現在の推論はCPUで実行します。'
            suffix: '-runtime'
            tag_suffix: '-cpu'
            compat_alias: false
            build_args: RUNTIME_VARIANT=cpu
            dockerfile: runtime/Dockerfile
          - image: ocms-runtime-cuda
            description: 'OCMSのタグ・キャラクター推定、意味検索、文字起こしと、お気に入りに基づく推薦に使う推論Runtime。CPU版とCUDAライブラリ同梱版を提供します。現在の推論はCPUで実行します。'
            suffix: '-runtime'
            tag_suffix: '-cuda'
            compat_alias: true
            build_args: RUNTIME_VARIANT=cuda
            dockerfile: runtime/Dockerfile
          - image: ocms-postgres
            description: 'OCMSのファイル情報と検索索引を保存するPostgreSQL。日本語全文検索用のPGroongaと、ベクトル検索用のpgvectorを同梱しています。'
            suffix: '-postgres'
            tag_suffix: ''
            compat_alias: false
            build_args: ''
            dockerfile: infra/postgres/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}${{ matrix.tag_suffix }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Release tag must be a valid Docker image tag (1-128 characters).'
            exit 1
          fi
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${REPOSITORY,,}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}${{ matrix.tag_suffix }}
            type=raw,value=latest${{ matrix.tag_suffix }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ matrix.compat_alias }}
            type=raw,value=latest,enable=${{ matrix.compat_alias && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
